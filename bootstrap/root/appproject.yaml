apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: laurel-poc
  namespace: argocd
spec:
  description: Laurel POC GitOps project
  sourceRepos:
    - https://github.com/gasper-az/aks-laurel-poc.git
  destinations:
    - namespace: "*"
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"