apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-storefront-l4
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: laurel-poc
  source:
    repoURL: https://github.com/gasper-az/aks-laurel-poc.git
    targetRevision: HEAD
    path: apps/storefront-l4
  destination:
    server: https://kubernetes.default.svc
    namespace: poc-l4
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true